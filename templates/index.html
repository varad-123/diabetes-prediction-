<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heatwave Prediction</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; background: #f5f5f5; color: #333; }
    h1 { font-size: 24px; margin-bottom: 6px; }
    p.sub { color: #888; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #e2874a; }
    button { width: 100%; padding: 12px; background: #e2874a; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    button:hover { background: #bd6b35; }
    .result { margin-top: 24px; padding: 16px; border-radius: 8px; font-size: 15px; background: #fff3ea; border: 1px solid #f5c9aa; }
  </style>
</head>
<body>
  <h1>Heatwave Prediction</h1>
  <p class="sub">Enter today's weather details below to get a heatwave risk prediction.</p>
  <form method="POST" action="/predict">
    <div class="form-group">
      <label>Max Temperature (°C)</label>
      <input type="number" name="MaxTemp" placeholder="e.g. 42" step="0.1" min="0" required/>
    </div>
    <div class="form-group">
      <label>Min Temperature (°C)</label>
      <input type="number" name="MinTemp" placeholder="e.g. 28" step="0.1" min="0" required/>
    </div>
    <div class="form-group">
      <label>Humidity (%)</label>
      <input type="number" name="Humidity" placeholder="e.g. 35" step="0.1" min="0" max="100" required/>
    </div>
    <div class="form-group">
      <label>Wind Speed (km/h)</label>
      <input type="number" name="WindSpeed" placeholder="e.g. 8" step="0.1" min="0" required/>
    </div>
    <div class="form-group">
      <label>Pressure (hPa)</label>
      <input type="number" name="Pressure" placeholder="e.g. 1005" step="0.1" min="0" required/>
    </div>
    <div class="form-group">
      <label>Historical Avg Temp for this date (°C)</label>
      <input type="number" name="HistAvgTemp" placeholder="e.g. 34" step="0.1" min="0" required/>
    </div>
    <button type="submit">Predict</button>
  </form>
  {% if prediction_text %}
    <div class="result">{{ prediction_text }}</div>
  {% endif %}
</body>
</html>
